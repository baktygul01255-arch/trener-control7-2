function homeView(){return `${header(false)}<main class="layout main-overlap"><section class="panel"><h2 class="section-title">${t('selectMode')}</h2><p class="sub">${t('selectModeSub')}</p><div class="mode-group"><button class="mode-card ${state.mode==='practice'?'active':''}" data-action="mode" data-value="practice"><span class="mode-icon">🧩</span><strong>${t('practice')}</strong><span>${t('practiceDesc')}</span></button><button class="mode-card ${state.mode==='exam'?'active':''}" data-action="mode" data-value="exam"><span class="mode-icon">⏱️</span><strong>${t('exam')}</strong><span>${t('examDesc')}</span></button></div></section><section class="panel"><h2 class="section-title">${t('choose')}</h2><p class="sub">${t('chooseSub')}</p><div class="variant-grid">${[1,2,3].map(i=>`<button class="variant" data-action="start" data-value="${i}"><span class="num">${i}</span><strong>${t('variant')} ${i}</strong><small>4 ${state.lang==='ru'?'задания':'тапсырма'} · 11 ${state.lang==='ru'?'баллов':'балл'}</small></button>`).join('')}${state.mode==='practice'?`<button class="variant extra" data-action="start" data-value="extra"><span class="num">+</span><strong>${t('extra')}</strong><small>${t('extraSub')}</small></button>`:''}</div><div class="note">${t('noteSource')}</div><div class="warnline">${t('noteDiff')}</div></section><section class="panel"><h2 class="section-title">${t('formulaTitle')}</h2><div class="formula-grid"><div class="formula"><span class="sym">s = v · t</span><small>${t('path')} = ${t('speed')} · ${t('time')}</small></div><div class="formula"><span class="sym">v = s / t</span><small>${t('speed')} = ${t('path')} / ${t('time')}</small></div><div class="formula"><span class="sym">v<sub>${L('ср','орт')}</sub> = s / t</span><small>${t('allTrip')}</small></div></div><div class="formula-note">📉 ${t('graphHint')}</div><details class="guides"><summary>${t('how')}</summary><p>${t('howText')}</p></details></section><footer class="footer">${t('localNote')}</footer></main>`}
function titleTask(n){return t('task'+n+'Title')}
function taskNav(){let count=state.mode==='practice'?Object.keys(state.checked).length:[1,2,3,4].filter(i=>hasInputs(i)).length;return `<aside class="panel side"><div class="progresslabel"><span>${t('progress')}</span><span>${count}/4</span></div><div class="progressrail"><div class="progressfill" style="width:${count*25}%"></div></div><nav class="task-nav" aria-label="Тапсырмалар / Задания">${[1,2,3,4].map(i=>`<button class="stepbtn ${state.task===i?'active':''} ${Object.prototype.hasOwnProperty.call(state.checked,i)?'done':''}" data-action="task" data-value="${i}"><span class="number">${Object.prototype.hasOwnProperty.call(state.checked,i)?'✓':i}</span><span>${titleTask(i)}</span></button>`).join('')}</nav><div class="side-footer">${state.mode==='exam'?t('noHints'):t('reviewHint')}<p>${t('roundNote')}</p></div></aside>`}
function hasInputs(n){let a=state.answers[n];if(n===1)return Object.values(a.symbols).some(Boolean)||Object.values(a.units).some(Boolean);if(n===4)return a.points.length>0||a.s!==''||a.time!==''||a.avg!=='';return Object.values(a).some(x=>x!=='')}
function taskShell(n,content){let max=maxScores[n],rev=(state.mode==='practice'&&Object.prototype.hasOwnProperty.call(state.checked,n))||state.completed;return `<div class="panel taskcard"><div class="taskheadline"><div><div class="tasklabel">${t('task')} 0${n} / 04</div><h2>${titleTask(n)}</h2><p class="sub">${t('task'+n+'Desc')}</p></div><span class="points">${max} ${t('pointsg')}</span></div>${state.mode==='exam'&&!state.completed?`<div class="exam-banner">⏱ ${t('examReminder')}</div>`:''}${content}${state.variant==='extra'?`<div class="note">${t('newNumberNote')}</div>`:''}${state.mode==='practice'?hintBlock(n):''}${rev?feedback(n):''}<div class="actionbar"><button class="btn btn-outline" data-action="prev" ${n===1?'disabled':''}>← ${t('previous')}</button><div class="rightactions">${state.mode==='practice'&&!state.completed?`<button class="btn btn-mint" data-action="check">✓ ${t('check')}</button>`:''}${n<4?`<button class="btn btn-primary" data-action="next">${t('next')}</button>`:state.mode==='exam'&&!state.completed?`<button class="btn btn-primary" data-action="finish">${t('finishExam')}</button>`:state.mode==='practice'&&!state.completed?`<button class="btn btn-primary" data-action="finish-practice">${t('finishPractice')}</button>`:''}${state.completed?`<button class="btn btn-primary" data-action="results">${t('total')}</button>`:''}</div></div></div>`}
function hintBlock(n){let help=t('t'+n+'help');return `<details class="guides" ${state.showHints[n]?'open':''} data-hint="${n}"><summary>💡 ${t('hint')}</summary><div class="guidebox"><p>${help}</p>${n===4?`<p>${t('graphInstruction')}</p>`:''}</div></details>`}
function makeSelect(field,val,items,label){return `<select class="ctrl" data-answer="${field}" aria-label="${label}" ${state.completed?'disabled':''}><option value="">— ${t('select')} —</option>${items.map(([v,s])=>`<option value="${v}" ${v===val?'selected':''}>${s}</option>`).join('')}</select>`}
function makeInput(field,val,label){return `<input class="ctrl numinput" type="text" inputmode="decimal" data-answer="${field}" ${state.completed?'disabled':''} value="${escapeAttr(val)}" placeholder="?" aria-label="${label}" autocomplete="off">`}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function taskOne(){let a=state.answers[1];let symbols=[['v','v'],['t','t'],['s','s / S']],units=[['mps',t('mps')],['sec',t('sec')],['m',t('meter')],['kph',t('kph')],['km',t('km')],['h',t('hour')]];let rows=[['speed',t('speed')],['time',t('time')],['path',t('path')]];return taskShell(1,`<p class="question">${t('task1Desc')}</p><table class="physics-table"><thead><tr><th>${t('magnitude')}</th><th>${t('symbol')}</th><th>${t('si')}</th></tr></thead><tbody>${rows.map(([k,name])=>`<tr><td>${name}</td><td>${makeSelect('1.symbols.'+k,a.symbols[k],symbols,name+' — '+t('symbol'))}</td><td>${makeSelect('1.units.'+k,a.units[k],units,name+' — '+t('si'))}</td></tr>`).join('')}</tbody></table>`)}
function speedPlot(v){let x0=64,y0=272,w=542,h=212,xs=w/6,ys=h/5;let parts=[];for(let i=0;i<=6;i++){let x=x0+i*xs;parts.push(`<line x1="${x}" y1="${y0-h}" x2="${x}" y2="${y0}" stroke="${i?'#e7edfa':'#647993'}" stroke-width="${i===0?1.5:1}"/><text x="${x}" y="${y0+21}" text-anchor="middle" font-size="14" fill="#61728c">${i}</text>`)}for(let j=0;j<=5;j++){let y=y0-j*ys;parts.push(`<line x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}" stroke="${j===0?'#7485a5':'#e7edfa'}"/><text x="${x0-14}" y="${y+5}" text-anchor="end" font-size="14" fill="#61728c">${j}</text>`)}let yv=y0-v*ys;return `<div class="graphbox"><svg viewBox="0 0 650 330" role="img" aria-label="${L('График постоянной скорости','Тұрақты жылдамдық графигі')}"><rect x="0" y="0" width="650" height="330" fill="white"/>${parts.join('')}<path d="M${x0},${y0} V${yv} H${x0+5*xs}" stroke="#18a18d" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M${x0+5*xs},${yv-6} v12" stroke="#18a18d" stroke-width="4"/><path d="M${x0},${y0-h-12} l-5 9 h10 z" fill="#6b7e9b"/><path d="M${x0+w+15},${y0} l-9 -5 v10 z" fill="#6b7e9b"/><text x="16" y="34" font-size="15" font-weight="750" fill="#415d82">v, ${t('mps')}</text><text x="${x0+w+9}" y="${y0+30}" font-size="15" font-weight="750" fill="#415d82">t, ${t('sec')}</text></svg><div class="graph-legend"><span>● ${t('speedGraph')}</span><span>${t('formulaS')}</span></div></div>`}
function taskTwo(){let d=current(),a=state.answers[2];return taskShell(2,`<p class="question">${t('findFor')} ${d.dur} ${t('seconds')}.</p><div class="split"><div>${speedPlot(d.v)}</div><div><p class="question">${t('task2Desc')}</p><div class="inputline"><label>${t('ansSpeed')}</label>${makeInput('2.v',a.v,t('ansSpeed'))}<span class="unit">${t('mps')}</span></div><div class="inputline"><label>${t('ansPath')}</label>${makeInput('2.s',a.s,t('ansPath'))}<span class="unit">${t('meter')}</span></div><div class="formula-note">${t('roundNote')}</div></div></div>`)}
function taskThree(){let d=current(),a=state.answers[3];let vehicle=veh[d.vehicle][state.lang];return taskShell(3,`<p class="story"><strong>${vehicle}</strong> ${L('за первый час проехал','бірінші сағатта')} ${d.dist[0]} ${t('km')}, ${L('за второй','екінші сағатта')} — ${d.dist[1]} ${t('km')}, ${L('за третий','үшінші сағатта')} — ${d.dist[2]} ${t('km')}. ${t('task3Question').replace(/^./,x=>x.toUpperCase())}.</p><div class="data-trip">${d.dist.map((k,i)=>`<div class="tripseg"><span class="tripno">${[t('firstHour'),t('secondHour'),t('thirdHour')][i]}</span><strong>${k} ${t('km')}</strong><small>1 ${t('hour')}</small></div>`).join('')}</div><div class="inputline"><label>${t('fullPath')} s</label>${makeInput('3.s',a.s,t('fullPath'))}<span class="unit">${t('km')}</span></div><div class="inputline"><label>${t('fullTime')} t</label>${makeInput('3.time',a.time,t('fullTime'))}<span class="unit">${t('hour')}</span></div><div class="inputline"><label>${t('avgSpeed')} v</label>${makeInput('3.avg',a.avg,t('avg'))}<span class="unit">${t('kph')}</span></div>`)}
function plotPoints(g){let p=totalG(g);return[[g.t1,g.v1*g.t1],[g.t1+g.stop,g.v1*g.t1],[p.t,p.s]]}
function pathD(pts,x0,y0,w,h){return pts.map((a,i)=>`${i?'L':'M'}${(x0+a[0]*w/6).toFixed(2)},${(y0-a[1]*h/300).toFixed(2)}`).join(' ')}
function pathPlot(review){let pts=state.answers[4].points,d=current(),x0=66,y0=355,w=590,h=300;let grid=[];for(let i=0;i<=12;i++){let x=x0+i*w/12;grid.push(`<line x1="${x}" x2="${x}" y1="${y0-h}" y2="${y0}" stroke="${i%2?'#e9eef8':'#d8e3f1'}" stroke-width="${i%2?1:1.1}"/>`);if(i%2===0)grid.push(`<text x="${x}" y="${y0+22}" text-anchor="middle" font-size="14" fill="#61738e">${i/2}</text>`)}for(let i=0;i<=12;i++){let y=y0-i*h/12;grid.push(`<line x1="${x0}" x2="${x0+w}" y1="${y}" y2="${y}" stroke="${i%2?'#e9eef8':'#d8e3f1'}" stroke-width="${i%2?1:1.1}"/>`);if(i%2===0)grid.push(`<text x="${x0-13}" y="${y+5}" text-anchor="end" font-size="14" fill="#61738e">${i*25}</text>`)}let fromOrigin=[[0,0],...pts], expected=[[0,0],...plotPoints(d.g)];let coordList=fromOrigin.map((p,i)=>`<circle cx="${x0+p[0]*w/6}" cy="${y0-p[1]*h/300}" r="${i===0?6:7}" stroke="white" stroke-width="2.5" fill="${i===0?'#233f82':'#4477ed'}"/>${i?`<text x="${x0+p[0]*w/6+10}" y="${y0-p[1]*h/300-9}" font-weight="800" fill="#285bd0" font-size="14">${i}</text>`:''}`).join('');return `<div class="graphbox"><svg class="tap-plot" id="pathPlot" viewBox="0 0 740 430" role="img" aria-label="${t('graphPart')}"><rect x="0" y="0" width="740" height="430" fill="white"/><rect x="${x0}" y="${y0-h}" width="${w}" height="${h}" fill="#fafdff"/>${grid.join('')}<path d="M${x0},${y0-h-14} l-6 11 h12 z" fill="#607797"/><path d="M${x0+w+15},${y0} l-12 -6 v12 z" fill="#607797"/><text x="12" y="36" font-size="15" font-weight="750" fill="#405c7b">${t('plotS')}</text><text x="${x0+w+5}" y="${y0+40}" font-size="15" font-weight="750" fill="#405c7b">${t('plotT')}</text>${review?`<path d="${pathD(expected,x0,y0,w,h)}" stroke="#0d9a81" stroke-width="4" fill="none" stroke-dasharray="10 7" stroke-linejoin="round"/>`:''}<path d="${pathD(fromOrigin,x0,y0,w,h)}" stroke="#4477ed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${coordList}<rect id="graphHit" x="${x0}" y="${y0-h}" width="${w}" height="${h}" fill="transparent" ${state.completed?'pointer-events="none"':''}/></svg><div class="graph-legend"><span>${t('graphStudent')}</span>${review?`<span style="color:#0d9a81">${t('graphExpected')}</span>`:`<span>${t('plotPrompt')}</span>`}</div></div>`}
function timeOptions(){let a=[];for(let v=.5;v<=6;v+=.5)a.push([v,fmt(v)]);return a}function pathOptions(){let a=[];for(let v=0;v<=300;v+=25)a.push([v,fmt(v)]);return a}
function taskFour(){let d=current(),a=state.answers[4],g=d.g,vehicleText=veh[d.gVehicle][state.lang];let storyText=state.lang==='ru'?`${vehicleText} ехал ${fmt(g.t1)} ч со скоростью ${g.v1} км/ч, затем стоял ${fmt(g.stop)} ч, после чего двигался ещё ${fmt(g.t2)} ч со скоростью ${g.v2} км/ч.`:`${vehicleText} ${fmt(g.t1)} сағ ${g.v1} км/сағ жылдамдықпен жүрді, кейін ${fmt(g.stop)} сағ аялдады, содан соң тағы ${fmt(g.t2)} сағ ${g.v2} км/сағ жылдамдықпен қозғалды.`;let rev=(state.mode==='practice'&&Object.prototype.hasOwnProperty.call(state.checked,4))||state.completed;let vehicle=veh[d.gVehicle][state.lang],pointlist=a.points.map((p,i)=>`<span class="pointchip">${i+1}: (${fmt(p[0])}; ${fmt(p[1])})</span>`).join('');return taskShell(4,`<p class="story">${storyText}</p><div class="split"><div>${pathPlot(rev)}</div><div><div class="formula-note" style="margin-top:0">${t('task4Desc')}</div><p class="question" style="margin-top:17px">${t('site')}</p><div class="plotcontrols"><div><label>${t('plotManualTime')}</label><select id="plotTime" class="ctrl">${timeOptions().map(([v,s])=>`<option value="${v}">${s}</option>`).join('')}</select></div><div><label>${t('plotManualPath')}</label><select id="plotDistance" class="ctrl">${pathOptions().map(([v,s])=>`<option value="${v}">${s}</option>`).join('')}</select></div></div><div class="plotcontrols"><button class="btn btn-secondary" data-action="add-point" ${state.completed?'disabled':''}>＋ ${t('addPoint')}</button><button class="btn btn-outline" data-action="clear-points" ${state.completed?'disabled':''}>${t('clearPoints')}</button></div><p class="tiny">${t('origin')} · ${t('yourPoints')}:</p><div class="pointchips" aria-live="polite">${pointlist||`<span class="tiny">${t('none')}</span>`}</div></div></div><div class="inputline"><label>${t('fullPath')} s</label>${makeInput('4.s',a.s,t('fullPath'))}<span class="unit">${t('km')}</span></div><div class="inputline"><label>${t('fullTime')} t</label>${makeInput('4.time',a.time,t('fullTime'))}<span class="unit">${t('hour')}</span></div><div class="inputline"><label>${t('avgSpeed')} v</label>${makeInput('4.avg',a.avg,t('avgSpeed'))}<span class="unit">${t('kph')}</span></div>`)}
function feedback(n){let d=current(),val=getScore(n),max=maxScores[n],ok=val===max;let body;if(n===1)body=`<p>${t('correctAnswer')}: <span class="work">v — ${t('mps')} · t — ${t('sec')} · s — ${t('meter')}</span></p>`;if(n===2)body=`<p>${t('correctAnswer')}: v = ${d.v} ${t('mps')}</p><p class="work">s = ${d.v} × ${d.dur} = ${d.v*d.dur} ${t('meter')}</p>`;if(n===3){let s=d.dist.reduce((x,y)=>x+y,0);body=`<p class="work">s = ${d.dist.join(' + ')} = ${s} ${t('km')}</p><p class="work">t = 1 + 1 + 1 = 3 ${t('hour')}</p><p class="work">v = ${s} / 3 = ${fmt(s/3)} ${t('kph')}</p>`;}if(n===4){let g=d.g,tot=totalG(g),pts=plotPoints(g);body=`<p>${t('correctAnswer')} — ${t('graphPart')}: <span class="work">(0;0) → ${pts.map(p=>'('+fmt(p[0])+';'+fmt(p[1])+')').join(' → ')}</span></p><p class="work">s = ${g.v1} × ${g.t1} + ${g.v2} × ${g.t2} = ${tot.s} ${t('km')}</p><p class="work">t = ${fmt(g.t1)} + ${fmt(g.stop)} + ${fmt(g.t2)} = ${fmt(tot.t)} ${t('hour')}</p><p class="work">v = ${tot.s} / ${fmt(tot.t)} ≈ ${fmt(tot.s/tot.t)} ${t('kph')}</p>`;}return `<div class="feedback ${ok?'':'warn'}"><h3>${ok?'✅ '+t('correct'):'🔎 '+t('improve')} · ${val}/${max} ${t('pointsg')}</h3>${body}<p class="tiny">${t('redo')}</p></div>`}
function taskView(){let n=state.task;return `<main class="layout main-overlap"><div class="workwrap">${taskNav()}<div class="taskcontent">${n===1?taskOne():n===2?taskTwo():n===3?taskThree():taskFour()}</div></div><footer class="footer">${t('localNote')}</footer></main>`}
function resultsView(){let total=getTotal(),label=state.mode==='exam'?t('well'):t('practiced');return `${header(true)}<main class="layout main-overlap"><div class="panel resultcard results"><div class="eyebrow">${t('total')}</div><h2>${label}</h2><p class="sub">${t('resultsSub')}</p><div class="score-ring" style="--pct:${total/11*100}%"><span>${total}<small style="font-size:17px">/11</small></span></div><div class="grade">${t('grade')}: ${grade(total)}</div><p class="tiny">${t('gradeLabel')}</p><div class="result-details">${[1,2,3,4].map(i=>`<div class="resultrow"><span>${i}. ${titleTask(i)}</span><div><strong>${getScore(i)}/${maxScores[i]}</strong> <button class="btn btn-secondary" data-action="review-task" data-value="${i}" style="margin-left:6px">${t('review')} →</button></div></div>`).join('')}</div><div class="resultactions"><button class="btn btn-primary" data-action="repeat">↻ ${t('repeat')}</button><button class="btn btn-secondary" data-action="new-random">＋ ${t('another')}</button><button class="btn btn-outline" data-action="download">↓ ${t('download')}</button><button class="btn btn-outline" data-action="go-home">${t('home')}</button></div><div class="endnote">${t('localNote')}</div></div></main>`}
function render(){document.documentElement.lang=state.lang==='ru'?'ru':'kk';document.title=state.lang==='ru'?'Механическое движение — тренажёр, 7 класс':'Механикалық қозғалыс — 7-сынып тренажёрі';$('#app').innerHTML=state.screen==='home'?homeView():state.screen==='results'?resultsView():header(true)+taskView();window.scrollTo({top:0,behavior:'instant'});}
function toast(txt){let el=$('#toast');el.textContent=txt;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2900)}
function fmtTime(){let min=Math.floor(state.timeLeft/60),sec=state.timeLeft%60;return String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null;}}
function launch(variant){stopTimer();state.variant=variant;state.custom=variant==='extra'?generated():null;state.workData=JSON.parse(JSON.stringify(variant==='extra'?state.custom:sourceVariants[state.lang][variant]));state.screen='session';state.task=1;state.answers=newAnswers();state.checked={};state.completed=false;state.finalScores=null;state.timeLeft=1200;state.showHints={};state.examTimedOut=false;render();if(state.mode==='exam'){state.timer=setInterval(()=>{if(state.screen!=='session'||state.completed){stopTimer();return}state.timeLeft-=1;let el=$('#countdown');if(el){el.textContent=fmtTime();el.classList.toggle('urgent',state.timeLeft<=120)}if(state.timeLeft<=0){state.examTimedOut=true;finish(false);toast(t('timeUp'))}},1000)}}
function finish(ask){if(state.mode==='exam'&&ask&&!window.confirm(t('confirmFinish')))return;stopTimer();state.finalScores={1:getScore(1),2:getScore(2),3:getScore(3),4:getScore(4)};state.completed=true;state.screen='results';render()}
function pointAdd(tm,ss){if(state.completed)return;let pts=state.answers[4].points;if(pts.length>=3){toast(t('stopPoints'));return}if(tm<=0){toast(t('timeZero'));return}if(pts.length>0&&tm<=pts[pts.length-1][0]){toast(t('pointOrder'));return}pts.push([tm,ss]);if(state.checked[4])delete state.checked[4];render();toast(t('pointAdded'))}
function saveInput(el){let path=el.getAttribute('data-answer');if(!path)return;let keys=path.split('.');if(keys.length===2){state.answers[Number(keys[0])][keys[1]]=el.value}else if(keys.length===3){state.answers[Number(keys[0])][keys[1]][keys[2]]=el.value}if(state.checked[state.task])delete state.checked[state.task];}
function insidePlot(event){let svg=$('#pathPlot');if(!svg||event.target.id!=='graphHit')return;let rect=svg.getBoundingClientRect(),x=(event.clientX-rect.left)*740/rect.width,y=(event.clientY-rect.top)*430/rect.height;let tm=Math.max(0,Math.min(6,Math.round(((x-66)/590*6)*2)/2));let ss=Math.max(0,Math.min(300,Math.round((355-y)/300*300/25)*25));pointAdd(tm,ss)}
function saveResults(){let d=current(),points=plotPoints(d.g),rows=[`${t('title')}`,`${state.mode==='exam'?t('examTag'):t('trainingTag')}`,`${state.variant==='extra'?t('extra'):t('variant')+' '+state.variant}`,`${t('total')}: ${getTotal()} / 11`,`${t('grade')}: ${grade(getTotal())}`,'',...[1,2,3,4].map(i=>`${i}. ${titleTask(i)} — ${getScore(i)}/${maxScores[i]}`),'',`${t('graphPart')}: ${points.map(p=>'('+fmt(p[0])+'; '+fmt(p[1])+')').join(' → ')}`];let b=new Blob([rows.join('\n')],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=`physics7_${state.lang}_result.txt`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('change',e=>{if(e.target.matches('[data-answer]'))saveInput(e.target);if(e.target.matches('details[data-hint]'))state.showHints[Number(e.target.getAttribute('data-hint'))]=e.target.open});
document.addEventListener('input',e=>{if(e.target.matches('input[data-answer]'))saveInput(e.target)});
document.addEventListener('click',e=>{if(e.target.id==='graphHit'){insidePlot(e);return}let target=e.target.closest('[data-action]');if(!target)return;let act=target.dataset.action,v=target.dataset.value;if(act==='language'){state.lang=v;render();return}if(act==='mode'){state.mode=v;render();return}if(act==='start'){launch(v==='extra'?'extra':Number(v));return}if(act==='go-home'){stopTimer();state.screen='home';state.completed=false;render();return}if(act==='task'||act==='review-task'){state.task=Number(v);if(act==='review-task')state.screen='session';render();return}if(act==='prev'){state.task=Math.max(1,state.task-1);render();return}if(act==='next'){state.task=Math.min(4,state.task+1);render();return}if(act==='check'){state.checked[state.task]=getScore(state.task);render();return}if(act==='finish-practice'){state.checked[state.task]=getScore(state.task);finish(false);return}if(act==='finish'){finish(true);return}if(act==='add-point'){pointAdd(Number($('#plotTime').value),Number($('#plotDistance').value));return}if(act==='clear-points'){state.answers[4].points=[];delete state.checked[4];render();return}if(act==='results'){state.screen='results';render();return}if(act==='repeat'){launch(state.variant);return}if(act==='new-random'){state.mode='practice';launch('extra');return}if(act==='download'){saveResults();return}});
render();
</script>
</body>
